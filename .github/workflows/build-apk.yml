name: Build & Publish QuietDrawer APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or initialize consistent signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from SIGNING_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64."
          elif git fetch --depth=1 origin ci-signing:refs/remotes/origin/ci-signing 2>/dev/null \
               && git show origin/ci-signing:debug.keystore.base64 > /tmp/ci-debug.keystore.base64 2>/dev/null; then
            tr -d '\r\n ' < /tmp/ci-debug.keystore.base64 | base64 -d > debug.keystore
            rm -f /tmp/ci-debug.keystore.base64
            echo "Restored consistent debug.keystore from ci-signing branch."
          else
            echo "First-time setup: generating one-time consistent signing keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=QuietDrawer,O=QuietDrawer,C=US"

            # Save once to an isolated orphan branch (ci-signing) so pushes to main never erase it
            TMP_REPO=$(mktemp -d)
            base64 debug.keystore | tr -d '\r\n' > "$TMP_REPO/debug.keystore.base64"
            git -C "$TMP_REPO" init
            git -C "$TMP_REPO" checkout -b ci-signing
            git -C "$TMP_REPO" config user.name "github-actions[bot]"
            git -C "$TMP_REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$TMP_REPO" add debug.keystore.base64
            git -C "$TMP_REPO" commit -m "Initialize consistent CI signing keystore"
            BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')
            git -C "$TMP_REPO" \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC_AUTH" \
              push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-signing
            rm -rf "$TMP_REPO"
            echo "Saved consistent signing keystore to ci-signing branch for all future updates."
          fi

          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA1:' | awk '{print $2}')
          if [ -z "$SHA1" ]; then
            echo "::error::Decoded debug.keystore is invalid or missing alias androiddebugkey."
            exit 1
          fi
          echo "Verified consistent signing key SHA-1: $SHA1"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK signature & prepare release asset
        id: pkg
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi
          APK_NAME="QuietDrawer-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n1 || true)
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_NAME"
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish raw APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          APK_NAME: ${{ steps.pkg.outputs.apk_name }}
          KEY_SHA1: ${{ steps.keystore.outputs.sha1 }}
        run: |
          NOTES=$(printf '%s\n' \
            "Ready-to-install Android APK for **QuietDrawer ${TAG}** (Build #${GITHUB_RUN_NUMBER})." \
            "" \
            "### How to install or update (no unzipping required)" \
            "1. Tap **Download APK** inside QuietDrawer Settings → App Updates, or tap \`${APK_NAME}\` under **Assets** below." \
            "2. Open the downloaded \`.apk\` file to install in place." \
            "3. If Android shows **App not installed** (only happens once when replacing an older mismatched signing key), back up in **Settings → Google Drive / Save local copy**, uninstall the older QuietDrawer once, and install \`${APK_NAME}\`. All future releases automatically reuse the exact same signing key (\`${KEY_SHA1}\`) and update seamlessly in place.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "QuietDrawer ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "QuietDrawer ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
